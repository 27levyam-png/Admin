<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ניהול משתמשים</title>
<style>.rep{border-top:1px solid #dde;padding:8px 0}body{font:16px system-ui,Arial;max-width:760px;margin:20px auto;padding:0 16px;background:#f6f7fb;color:#1b1f2a}h1{font-size:22px}input,button{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid #c5c9d6}button{background:#3b5bdb;color:#fff;border:0;cursor:pointer}button.g{background:#e8eaf2;color:#1b1f2a}button.r{background:#d6336c}.card{background:#fff;border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 1px 3px #0001}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid #eceef5;text-align:right;font-size:14px}.bar{height:8px;border-radius:4px;background:#e4e7f2;overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:#3b5bdb}.off{opacity:.5}code{direction:ltr;unicode-bidi:embed}</style></head><body>
<h1>ניהול משתמשים</h1>
<div class="card"><div class="row"><input id="k" type="password" dir="ltr" placeholder="סיסמת מנהל (ADMIN_KEY)" onkeydown="if(event.key==='Enter')load()"><button onclick="load()">התחברות</button></div><small>הסיסמה נשמרת רק בלשונית הזו ונמחקת כשסוגרים אותה.</small><input id="u" type="hidden" value="https://english-tutor-api.27levyam.workers.dev"></div>
<div class="card"><b>הוספה / עדכון</b><div class="row"><input id="c" dir="ltr" placeholder="קוד (ריק = ייווצר אוטומטית)"><input id="n" placeholder="שם"><input id="q" type="number" step="0.5" min="0" value="3" style="width:90px" title="מכסה חודשית בדולרים"><span>$ לחודש</span><input id="md" type="number" min="0" max="10" value="3" style="width:70px" title="כמה מכשירים מותרים לקוד (0 = ללא הגבלה)"><span>מכשירים</span><button onclick="save()">שמירה</button></div></div>
<div class="card"><b>דיווחים ורעיונות <span id="rpn"></span></b> <button class="g" onclick="reps()">רענון</button><div id="rp" style="margin-top:8px"></div></div>
<div class="card"><table><thead><tr><th>משתמש</th><th>פעילות</th><th>שימוש החודש</th><th></th></tr></thead><tbody id="t"></tbody></table><div id="m"></div></div>
<script>
const $=i=>document.getElementById(i);
$('k').value=sessionStorage.getItem('k')||'';
async function api(p,b){const r=await fetch($('u').value.replace(/\/+$/,'')+p,{method:b?'POST':'GET',headers:{Authorization:'Bearer '+$('k').value,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}
const esc=x=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function dur(s){s=Math.round(s||0);const h=Math.floor(s/3600),m=Math.round(s%3600/60);return h?h+' שעות ו-'+m+' דק׳':m+' דק׳'}
function ago(t){const m=Math.round((Date.now()-t)/6e4);return m<2?'ממש עכשיו':m<60?'לפני '+m+' דק׳':m<1440?'לפני '+Math.round(m/60)+' שעות':'לפני '+Math.round(m/1440)+' ימים'}
function gen(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<8;i++){s+=a[Math.floor(Math.random()*a.length)];if(i==3)s+='-'}return s}
async function load(){try{sessionStorage.setItem('k',$('k').value);const j=await api('/admin/list');
 $('t').innerHTML=j.users.map(u=>{const p=u.quota?Math.min(100,u.used/u.quota*100):100,c=u.calls||{};return `<tr class="${u.disabled?'off':''}"><td><b>${esc(u.name||'ללא שם')}</b><br><code>${u.code}</code></td><td>${u.last?'נראה '+ago(u.last):'עוד לא התחבר'}<br>${u.sessions||0} כניסות · ${dur(u.active)}<br><small>מכשירים: ${(u.devs||[]).length}/${u.maxDev||'∞'}<br>שיחה ${c.chat||0} · דיבור ${c.stt||0} · הקראה ${c.tts||0}</small></td><td><div class="bar"><i style="width:${p}%"></i></div>$${u.used.toFixed(3)} / $${u.quota}<br><small>סה"כ מאז ההתחלה: $${(u.total||0).toFixed(2)}</small></td><td><button class="g" onclick="edit('${u.code}','${esc(u.name||'').replace(/'/g,'')}',${u.quota},${u.maxDev||0})">עריכה</button> <button class="g" onclick="lnk('${u.code}')">קישור</button> <button class="g" onclick="act('${u.code}',{resetDevs:true})">אפס מכשירים</button> <button class="g" onclick="act('${u.code}',{resetUsed:true})">איפוס</button> <button class="g" onclick="act('${u.code}',{disabled:${!u.disabled}})">${u.disabled?'הפעלה':'השהיה'}</button> <button class="r" onclick="del('${u.code}')">מחיקה</button></td></tr>`}).join('')||'<tr><td colspan=4>אין משתמשים עדיין</td></tr>';$('m').textContent='';reps()}catch(e){$('m').textContent='שגיאה: '+e.message}}
function edit(c,n,q,d){$('c').value=c;$('n').value=n;$('q').value=q;$('md').value=d}
const SITE='https://27levyam-png.github.io/english-tutor/';
function lnk(c){const u=SITE+'?code='+c;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>{$('m').textContent='הקישור הועתק: '+u},()=>prompt('העתיקו את הקישור:',u))}
async function save(){try{const c=$('c').value.trim()||gen();await api('/admin/set',{code:c,name:$('n').value,quota:+$('q').value,maxDev:+$('md').value});$('c').value='';$('m').textContent='נשמר. הקוד: '+c.toUpperCase();load()}catch(e){$('m').textContent='שגיאה: '+e.message}}
async function act(c,o){await api('/admin/set',{code:c,...o});load()}
async function del(c){if(confirm('למחוק את '+c+'?')){await api('/admin/del',{code:c});load()}}
async function reps(){try{const j=await api('/admin/reports');const T={bug:'🐞 תקלה',idea:'💡 רעיון',other:'💬 אחר'};
 $('rp').innerHTML=j.reports.map(r=>`<div class="rep"><b>${T[r.type]||''}</b> · ${esc(r.name||'ללא שם')} · <small>${new Date(r.ts).toLocaleString('he-IL')} · גרסה ${esc(r.ver||'')}</small><p style="white-space:pre-wrap;margin:6px 0">${esc(r.text)}</p><small>${esc(r.ctx||'')}</small> <button class="r" onclick="repdel('${r.id}')">מחיקה</button></div>`).join('')||'אין דיווחים';$('rpn').textContent=j.total?'('+j.total+')':''}catch(e){$('rp').textContent='שגיאה: '+e.message}}
async function repdel(id){await api('/admin/repdel',{id});reps()}
</script><p style="font-size:13px;color:#667">זמן הפעילות הוא הערכה לפי פעולות מול השרת: רווח של עד 5 דקות בין פעולות נחשב פעיל, וכניסה חדשה נספרת אחרי הפסקה של חצי שעה. הנתונים מתעדכנים בהשהיה של עד חצי דקה.</p></body></html>
